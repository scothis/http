[workspace]
resolver = "2"
members = [
    "components/*",
    "crates/*",
]
exclude = [
    "components/gate",
    "components/latch-method-readonly",
    "components/latch-method-readonly-config",
    "components/wit",
]

[workspace.dependencies]
latch-n = { path = "./crates/latch-n" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wit-bindgen = "0.62.0"
